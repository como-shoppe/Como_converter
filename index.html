<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>蝦皮推廣連結轉換器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <div class="tag">Como_shoppe</div>
    <h1>蝦皮推廣連結轉換器</h1>
    <p class="subtitle">轉換連結領取專屬優惠券</p>

    <div class="input-group">
      <label class="input-label">蝦皮連結</label>
      <textarea id="inputText" rows="5" placeholder="一次最多貼上 5 個蝦皮連結，每行一個"></textarea>
      
      <button id="convertBtn" class="btn primary-btn">產生推廣連結</button>
      <button id="clearBtn" class="btn clear-btn">清除</button>
    </div>

    <div id="resultArea" class="result-group hidden">
      <label class="input-label">推廣連結</label>
      <textarea id="outputText" rows="5" readonly></textarea>
      <button id="copyBtn" class="btn success-btn">一鍵複製全部</button>
    </div>
  </main>

  <div id="toast" class="toast">已複製到剪貼簿！</div>

  <script src="script.js"></script>
</body>
</html>
