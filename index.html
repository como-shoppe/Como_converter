<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>蝦皮推廣連結轉換器</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <div class="tag">油飯DD｜省錢攻略</div>
    <h1>蝦皮推廣連結轉換器</h1>
    <p class="subtitle">快速轉換連結套用專屬優惠券！</p>

    <div class="input-group">
      <textarea id="inputText" rows="4" placeholder="請在此貼上蝦皮商品連結..."></textarea>
      <button id="convertBtn" class="btn primary-btn">一鍵轉換</button>
    </div>

    <div id="resultArea" class="result-group hidden">
      <textarea id="outputText" rows="4" readonly></textarea>
      <button id="copyBtn" class="btn success-btn">複製結果</button>
    </div>

    <a href="https://openchat.line.me/" target="_blank" class="line-btn">
      加入 LINE 社群看更多優惠
    </a>
  </main>

  <div id="toast" class="toast">已複製到剪貼簿！</div>

  <script src="script.js"></script>
</body>
</html>
